<title>Jason Cutaiar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<meta name="description" content="Jason Cutaiar, CEO of Made: real estate, investments and business.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&family=Inter:wght@300;400;500&display=swap">
<style>
/* Jason Cutaiar: one screen, nothing else. The madecon.com first-screen background, the name in Jason's header lettering,
   a subtitle, three points, Contact (a brief in a pop-up, page blurred behind) and Connect on LinkedIn. */
:root{--background:#131316;--foreground:#f8fafc;--accent:#c9c1b6;--ink:#3d3e43;--line:#2a2a2f;--ease:cubic-bezier(.25,.46,.45,.94);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--background);color:var(--foreground);font:400 16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit}

/* the stone background of madecon.com's first screen */
.page{position:relative;height:100vh;height:100dvh;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,#131316 0%,#0d0d11 40%,#0a090c 100%);
  padding:40px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px))}
.page::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:url(img/texture.webp),radial-gradient(circle at 20% 30%,rgba(224,215,201,.1) 1px,transparent 1px),radial-gradient(circle at 80% 70%,rgba(201,193,182,.1) 1px,transparent 1px);
  background-size:cover,300px 300px,200px 200px;background-blend-mode:overlay,normal,normal;opacity:.3;animation:cosmicDrift 30s linear infinite}
@keyframes cosmicDrift{to{transform:translate(-100px,-50px)}}

.inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;width:min(100%,1100px)}
h1{margin:0;width:100%;display:flex;justify-content:center}
h1 svg{display:block;height:auto;overflow:visible}
h1 .wide{width:min(88vw,980px)}
h1 .stack{display:none;width:min(80vw,420px)}
@media (max-width:640px){h1 .wide{display:none}h1 .stack{display:block}}
h1 .ink,h1 .edge{fill:none;stroke-width:34;stroke-linejoin:miter;stroke-linecap:butt}
h1 .ink{stroke:var(--ink)}
h1 .edge{stroke:rgba(255,255,255,.08)}
h1 .ink path,h1 .edge path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s cubic-bezier(.6,0,.2,1) forwards;animation-delay:calc(.35s + var(--d,0) * 1s)}
@keyframes draw{to{stroke-dashoffset:0}}
h1 .shine{opacity:0;animation:fadeIn .1s 2.9s forwards}
@keyframes fadeIn{to{opacity:1}}

.sub{margin:clamp(22px,4vh,34px) 0 0;font:400 clamp(.8rem,1.5vw,.95rem)/1.2 Inter,system-ui,sans-serif;letter-spacing:.34em;margin-right:-.34em;text-transform:uppercase;color:var(--accent)}
.points{list-style:none;margin:clamp(20px,3.6vh,30px) 0 0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:10px clamp(22px,3.4vw,40px)}
.points li{display:flex;align-items:center;gap:12px;font:300 clamp(1.05rem,1.9vw,1.3rem)/1.3 Jost,system-ui,sans-serif;color:rgba(248,250,252,.82);letter-spacing:.02em}
.points li::before{content:"";width:6px;height:6px;background:var(--accent);transform:rotate(45deg);flex:none}
@media (max-width:640px){.points{flex-direction:column;align-items:center;gap:12px}}
.ctas{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:clamp(30px,5.5vh,46px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:44px;min-width:150px;padding:0 20px;border-radius:10px;border:1px solid rgba(255,255,255,.4);background:rgba(19,19,22,.6);
  color:#fff;font:500 14px/1 Inter,system-ui,sans-serif;text-decoration:none;cursor:pointer;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);transition:background .25s,border-color .25s,color .25s}
.btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.65)}
.btn.solid{background:var(--accent);border-color:var(--accent);color:#131316}
.btn.solid:hover{background:#ddd6cc;border-color:#ddd6cc}
.btn svg{width:16px;height:16px;flex:none}

/* everything after the name fades in, like madecon.com's first screen */
.in{opacity:0;transform:translateY(14px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
.ready .in{opacity:1;transform:none}
.ready .in.d1{transition-delay:1.5s}.ready .in.d2{transition-delay:1.75s}.ready .in.d3{transition-delay:2.1s}

/* the brief: a pop-up in the middle, the page blurred behind it */
dialog{width:min(560px,calc(100% - 28px));max-height:calc(100dvh - 32px);margin:auto;padding:0;border:0;background:transparent;color:var(--foreground);overflow:visible}
dialog::backdrop{background:rgba(8,8,10,.5);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;transition:opacity .25s}
dialog.open::backdrop{opacity:1}
.box{position:relative;max-height:calc(100dvh - 32px);overflow:auto;padding:clamp(22px,4vw,34px);border-radius:14px;background:#17171b;border:1px solid var(--line);box-shadow:0 40px 100px -30px rgba(0,0,0,.8);
  opacity:0;transform:translateY(14px) scale(.97);transition:opacity .25s,transform .3s var(--ease)}
dialog.open .box{opacity:1;transform:none}
.box h2{margin:0;font:300 2rem/1.1 Jost,system-ui,sans-serif}
.box .lede{margin:8px 0 22px;color:rgba(248,250,252,.6);font-size:.95rem}
.x{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:transparent;color:#fff;font-size:1.4rem;line-height:1;cursor:pointer}
.x:hover{border-color:rgba(255,255,255,.4)}
form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
form .full{grid-column:1/-1}
label{display:grid;gap:7px;font:500 11px/1 Inter,system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:rgba(201,193,182,.85)}
input,textarea{font:400 15px/1.4 Inter,system-ui,sans-serif;color:#fff;background:#111114;border:1px solid var(--line);border-radius:10px;padding:12px 13px;min-width:0;transition:border-color .2s}
input:focus,textarea:focus{outline:none;border-color:rgba(201,193,182,.7)}
textarea{min-height:110px;resize:vertical}
form .btn{margin-top:4px;justify-self:start}
.done{grid-column:1/-1;margin:0;padding:12px 14px;border:1px solid var(--line);border-radius:10px;color:rgba(248,250,252,.85);font-size:.95rem}
html:has(dialog[open]){overflow:hidden}
@media (max-width:520px){form{grid-template-columns:1fr}}

/* preview label (not on the live site) */
.draft-tag{position:fixed;left:14px;bottom:12px;z-index:60;font:500 10px/1 Inter,system-ui,sans-serif;letter-spacing:.08em;color:rgba(201,193,182,.45);pointer-events:none}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}h1 .ink path,h1 .edge path{stroke-dashoffset:0}h1 .shine{opacity:0}.in{opacity:1;transform:none}}
</style>

    <p class="sub in d1">CEO of Made</p>
    <ul class="points in d2"><li>Real Estate</li><li>Investments</li><li>Business</li></ul>

<script>
/* Where the brief goes: put the email address between the quotes (once). The first message sent asks that inbox to
   confirm it (a one-time email from FormSubmit), then every brief arrives there. Empty = preview mode, nothing is sent. */
window.CONTACT_EMAIL = '';
(() => {
  setTimeout(() => document.getElementById('page').classList.add('ready'), 300);
  const dlg = document.getElementById('brief'), form = document.getElementById('form'), done = document.getElementById('done');
  const open = () => { done.hidden = true; dlg.showModal(); requestAnimationFrame(() => dlg.classList.add('open')); setTimeout(() => form.name.focus({ preventScroll: true }), 60); };
  const close = () => { dlg.classList.remove('open'); setTimeout(() => dlg.open && dlg.close(), 220); };
  document.getElementById('open').addEventListener('click', open);
  document.getElementById('close').addEventListener('click', close);
  dlg.addEventListener('click', e => { if (e.target === dlg) close(); });
  dlg.addEventListener('cancel', e => { e.preventDefault(); close(); });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    for (const el of form.querySelectorAll('[required]')) { if (!el.value.trim() || (el.type === 'email' && !/^\S+@\S+\.\S+$/.test(el.value))) { el.focus(); return; } }
    const btn = form.querySelector('[type=submit]'); btn.disabled = true;
    if (!window.CONTACT_EMAIL) { done.textContent = 'Thank you. This is a preview, so nothing was sent.'; done.hidden = false; btn.disabled = false; return; }
    try {
      const r = await fetch('https://formsubmit.co/ajax/' + encodeURIComponent(window.CONTACT_EMAIL), { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ _subject: 'New message from Jason Cutaiar', name: form.name.value, email: form.email.value, phone: form.phone.value, message: form.message.value, _template: 'table' }) });
      done.textContent = r.ok ? 'Thank you, your message was sent.' : 'Sorry, that did not go through. Please try again.';
      if (r.ok) form.reset();
    } catch (err) { done.textContent = 'Sorry, that did not go through. Please try again.'; }
    done.hidden = false; btn.disabled = false;
  });
})();
</script>
