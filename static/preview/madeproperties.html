<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Made Properties</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="description" content="Made Properties, led by Jason Cutaiar: real estate investments, transformation and activation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap">
<style>
/* Made Properties: one screen, laid out like Jason's own mockups (Nov 27): the lockup in his lettering with the first word
   in negative (outlined), a few lines of small caps under it, and LinkedIn. A soft background is Jason's own image (img/bg.webp). */
:root{--bg:#141417;--silver:#d9d9df;--mut:rgba(226,226,232,.78);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--silver);font:500 16px/1.6 Montserrat,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.page{position:relative;height:100vh;height:100dvh;display:grid;place-items:center;overflow:hidden;background:#0b0b0d url(madeproperties-img/bg.webp) center/cover no-repeat;
  padding:40px max(28px,env(safe-area-inset-right,0px)) 40px max(28px,env(safe-area-inset-left,0px))}
.inner{position:relative;z-index:1;width:min(100%,440px)}
h1{margin:0}
h1 svg{display:block;width:100%;height:auto;overflow:visible}
.neg path{fill:none;stroke:#fff;stroke-width:34;stroke-linejoin:miter;stroke-linecap:butt}
.neg2 path{fill:none;stroke:#fff;stroke-width:34;stroke-linejoin:miter;stroke-linecap:butt}
.solid path{fill:none;stroke:var(--silver);stroke-width:34;stroke-linejoin:miter;stroke-linecap:butt}
h1 path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s cubic-bezier(.6,0,.2,1) forwards;animation-delay:calc(.3s + var(--d,0) * 1s)}
@keyframes draw{to{stroke-dashoffset:0}}
.lines{margin:clamp(30px,6vh,48px) 0 0;padding:0;list-style:none;display:grid;gap:10px}
.lines li{font:600 clamp(10px,1.1vw,12px)/1.4 Montserrat,sans-serif;letter-spacing:.32em;text-transform:uppercase;color:var(--mut)}
.lines li.big{font-size:clamp(11px,1.3vw,14px);color:var(--silver)}
.lines li.in{padding-left:1.1em;font-size:clamp(9px,.95vw,10.5px)}
.lines.tc li{text-transform:none;letter-spacing:.14em;font-weight:500;font-size:clamp(11px,1.2vw,13px)}
.foot{display:flex;align-items:center;gap:22px;margin-top:clamp(30px,6vh,46px);font:600 clamp(9px,1vw,11px)/1 Montserrat,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:var(--mut)}
.foot a{display:inline-flex;color:#fff;transition:opacity .2s}
.foot a:hover{opacity:.7}
.foot svg{width:18px;height:18px}
.fade{opacity:0;transform:translateY(10px);transition:opacity 1s ease,transform 1s ease}
.ready .fade{opacity:1;transform:none}
.ready .f1{transition-delay:1.4s}.ready .f2{transition-delay:1.7s}
.draft-tag{position:fixed;left:14px;bottom:12px;z-index:60;font:500 10px/1 Montserrat,sans-serif;letter-spacing:.08em;color:rgba(220,220,226,.4);pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}h1 path{stroke-dashoffset:0}.fade{opacity:1;transform:none}}
</style>
</head>
<body>
<main class="page" id="page">

ansform="translate(780 0)" style="--d:0.59"><path pathLength="1" d="M80 17H220A63 63 0 0 1 283 80V164A63 63 0 0 1 220 227H80A63 63 0 0 1 17 164V80A63 63 0 0 1 80 17Z"/></g><g transform="translate(1200 0)" style="--d:0.71"><path pathLength="1" d="M17 244V0"/><path pathLength="1" d="M17 17H231.25A51.75 51.75 0 0 1 283 68.75V68.75A51.75 51.75 0 0 1 231.25 120.5H17"/></g><g transform="translate(1620 0)" style="--d:0.83"><path pathLength="1" d="M300 17H80A63 63 0 0 0 17 80V164A63 63 0 0 0 80 227H300"/><path pathLength="1" d="M17 120.5H300"/></g><g transform="translate(2040 0)" style="--d:0.95"><path pathLength="1" d="M17 244V17H160A63 63 0 0 1 223 80V96"/></g><g transform="translate(2400 0)" style="--d:1.07"><path pathLength="1" d="M96 0V164A63 63 0 0 0 159 227H240"/><path pathLength="1" d="M0 17H192"/></g><g transform="translate(2760 0)" style="--d:1.19"><path pathLength="1" d="M17 0V244"/></g><g transform="translate(2914 0)" style="--d:1.31"><path pathLength="1" d="M300 17H80A63 63 0 0 0 17 80V164A63 63 0 0 0 80 227H300"/><path pathLength="1" d="M17 120.5H300"/></g><g transform="translate(3334 0)" style="--d:1.43"><path pathLength="1" d="M300 17H80A63 63 0 0 0 17 80V120.5H229.75A53.25 53.25 0 0 1 283 173.75V173.75A53.25 53.25 0 0 1 229.75 227H0"/></g></g></g></svg></h1>
    <ul class="lines fade f1"><li class="big">Real Estate Investments</li><li class="in">Transformation</li><li class="in">Activation</li></ul>
    <div class="foot fade f2"><span>Jason Cutaiar &middot; CEO</span><a href="https://www.linkedin.com/in/madecon/" target="_blank" rel="noopener" aria-label="Jason Cutaiar on LinkedIn"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.75h4v11H3zM9.5 9.75h3.8v1.5h.06c.53-1 1.83-2.06 3.77-2.06 4.03 0 4.77 2.6 4.77 6v5.56h-4v-4.93c0-1.18-.02-2.7-1.65-2.7-1.65 0-1.9 1.29-1.9 2.62v5.01h-4z"/></svg></a></div>
  </div>
</main>
