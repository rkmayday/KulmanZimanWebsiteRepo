<!doctype html><html><body style="margin:0;background:transparent">
<canvas id="c" width="512" height="512"></canvas>
<script src="three.min.js"></script>
<script>
const W = 512;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, W, false);
renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.2;
renderer.physicallyCorrectLights = true;
// a studio made of soft light panels, for reflections
function studio() {
  const s = new THREE.Scene();
  s.background = new THREE.Color(0x0b0b0c);
  const panel = (w, h, x, y, z, ry, rx, c, k) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(k), side: THREE.DoubleSide })); m.position.set(x, y, z); m.rotation.y = ry; m.rotation.x = rx; s.add(m); };
  panel(16, .7, 0, 6, 0, 0, Math.PI / 2, 0xffffff, 7);         // thin top strip
  panel(16, .5, 0, 5, -3, 0, Math.PI / 2.2, 0xffffff, 5);
  panel(.9, 12, -7, 0, 3, Math.PI / 2.3, 0, 0xffffff, 5);       // left strip
  panel(.6, 10, 7, 0, 1, -Math.PI / 2.3, 0, 0xdfe6ff, 3);       // right strip, cool
  panel(30, 30, 0, -7, 0, 0, -Math.PI / 2, 0x2a2a2e, 1);        // dark grey floor (darker lower reflections)
  panel(4, 2, 3, 2, -8, 0, 0, 0xfff1e0, 2);                     // small warm card behind
  return s;
}
const pm = new THREE.PMREMGenerator(renderer);
// the studio as a painted panorama: dark sky, a bright horizon, dark floor and a few softbox strips (the classic chrome look)
function pano() {
  const c = document.createElement('canvas'); c.width = 2048; c.height = 1024; const x = c.getContext('2d');
  const gr = x.createLinearGradient(0, 0, 0, 1024);
  gr.addColorStop(0, '#c4c4ca'); gr.addColorStop(.22, '#6a6a70'); gr.addColorStop(.42, '#232327'); gr.addColorStop(.49, '#ffffff'); gr.addColorStop(.52, '#d6d6db');
  gr.addColorStop(.6, '#46464b'); gr.addColorStop(.8, '#1a1a1d'); gr.addColorStop(1, '#55555a');
  x.fillStyle = gr; x.fillRect(0, 0, 2048, 1024);
  const strip = (cx, w, y0, y1, a, col) => { const g = x.createLinearGradient(cx - w, 0, cx + w, 0); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.5, col.replace('A', a)); g.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(cx - w, y0, w * 2, y1 - y0); };
  strip(300, 110, 60, 480, 1, 'rgba(255,255,255,A)'); strip(760, 26, 160, 460, .9, 'rgba(255,255,255,A)');
  strip(1300, 140, 60, 480, .9, 'rgba(225,232,255,A)'); strip(1750, 40, 200, 470, .7, 'rgba(255,240,224,A)');
  x.fillStyle = 'rgba(255,255,255,.95)'; x.fillRect(0, 60, 2048, 18);
  { x.save(); x.translate(1120, 390); x.rotate(-.75); const lg = x.createLinearGradient(-70, 0, 70, 0); lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(.35, 'rgba(255,255,255,.75)'); lg.addColorStop(.5, 'rgba(255,255,255,1)'); lg.addColorStop(.65, 'rgba(255,255,255,.75)'); lg.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = lg; x.fillRect(-70, -300, 140, 600); x.restore(); }   // a diagonal streak of light behind the camera: every face turned to the viewer shows a glossy highlight
  const t = new THREE.CanvasTexture(c); t.mapping = THREE.EquirectangularReflectionMapping; t.encoding = THREE.sRGBEncoding; return t;
}
const envTex = pm.fromEquirectangular(pano()).texture;
const scene = new THREE.Scene(); scene.environment = envTex;
const cam = new THREE.PerspectiveCamera(30, 1, .1, 100); cam.position.set(0, 0, 9); cam.lookAt(0, 0, 0);
const key = new THREE.DirectionalLight(0xffffff, .6); key.position.set(3, 5, 6); scene.add(key);
const chrome = () => new THREE.MeshPhysicalMaterial({ color: 0xe8e8ea, metalness: 1, roughness: .06, clearcoat: 1, clearcoatRoughness: .05, envMapIntensity: 1.25 });
const black = () => new THREE.MeshPhysicalMaterial({ color: 0x030303, metalness: .1, roughness: .1, clearcoat: 1, clearcoatRoughness: .03, envMapIntensity: 2.6 });
const rbox = (w, h, d, r, mat) => { const s = new THREE.Shape(); const x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r); s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  const g = new THREE.ExtrudeGeometry(s, { depth: d, bevelEnabled: true, bevelThickness: .12, bevelSize: .12, bevelSegments: 8, curveSegments: 16 }); g.center(); return new THREE.Mesh(g, mat); };
const G = new THREE.Group(); scene.add(G);
const ICONS = {
  // 01 draft: a pencil
  draft() { const g = new THREE.Group(); const body = new THREE.Mesh(new THREE.CylinderGeometry(.42, .42, 3.2, 6), black()); g.add(body);
    const tip = new THREE.Mesh(new THREE.ConeGeometry(.42, .9, 6), chrome()); tip.position.y = -2.05; tip.rotation.z = Math.PI; g.add(tip);
    const band = new THREE.Mesh(new THREE.CylinderGeometry(.45, .45, .5, 24), chrome()); band.position.y = 1.55; g.add(band);
    const er = new THREE.Mesh(new THREE.CylinderGeometry(.4, .4, .4, 24), black()); er.position.y = 1.95; g.add(er);
    g.rotation.z = -.75; return g; },
  // 02 iterate: two looping arrows
  loop() { const g = new THREE.Group(); const t = new THREE.Mesh(new THREE.TorusGeometry(1.4, .28, 32, 96, Math.PI * 1.55), chrome()); t.rotation.z = .5; g.add(t);
    const h = new THREE.Mesh(new THREE.ConeGeometry(.6, .9, 32), chrome()); const a = .5 + Math.PI * 1.55; h.position.set(Math.cos(a) * 1.4, Math.sin(a) * 1.4, 0); h.rotation.z = a; g.add(h); return g; },
  // 03 delivery: a check mark
  check() { const g = new THREE.Group(); const a = rbox(.75, 1.7, .5, .3, chrome()); a.position.set(-.75, -.35, 0); a.rotation.z = .8; g.add(a);
    const b = rbox(.75, 3.2, .5, .3, chrome()); b.position.set(.55, .35, 0); b.rotation.z = -.62; g.add(b); return g; },
  // tools
  mail() { const g = new THREE.Group(); g.add(rbox(3.4, 2.3, .4, .25, black()));
    const f1 = rbox(2.2, .22, .2, .1, chrome()); f1.position.set(-.62, .3, .35); f1.rotation.z = -.62; g.add(f1);
    const f2 = rbox(2.2, .22, .2, .1, chrome()); f2.position.set(.62, .3, .35); f2.rotation.z = .62; g.add(f2); return g; },
  calendar() { const g = new THREE.Group(); g.add(rbox(3, 2.8, .45, .3, black())); const top = rbox(3, .7, .5, .25, chrome()); top.position.set(0, 1.05, .05); g.add(top);
    for (const x of [-.8, .8]) { const r = new THREE.Mesh(new THREE.TorusGeometry(.24, .09, 16, 40), chrome()); r.position.set(x, 1.5, .3); g.add(r); }
    for (let i = 0; i < 6; i++) { const d = rbox(.42, .42, .15, .1, chrome()); d.position.set(-.85 + (i % 3) * .85, .05 - Math.floor(i / 3) * .7, .35); g.add(d); } return g; },
  card() { const g = new THREE.Group(); g.add(rbox(3.6, 2.3, .22, .25, black())); const s = rbox(3.6, .45, .1, .02, chrome()); s.position.set(0, .45, .2); g.add(s);
    const chip = rbox(.6, .45, .1, .08, chrome()); chip.position.set(-1.1, -.35, .22); g.add(chip); g.rotation.x = -.25; return g; },
  signup() { const g = new THREE.Group(); const t = new THREE.Mesh(new THREE.TorusGeometry(1.25, .26, 32, 96, Math.PI * 1.75), chrome()); t.rotation.z = -.3; g.add(t);
    const i = new THREE.Mesh(new THREE.TorusGeometry(.5, .24, 32, 64), chrome()); g.add(i); const tail = rbox(.48, 1.1, .48, .2, chrome()); tail.position.set(.98, -.2, 0); g.add(tail); return g; },
  pin() { const g = new THREE.Group(); const s = new THREE.Mesh(new THREE.SphereGeometry(1.1, 64, 48), chrome()); s.position.y = .5; g.add(s);
    const c = new THREE.Mesh(new THREE.ConeGeometry(.82, 1.9, 64), chrome()); c.position.y = -.85; c.rotation.z = Math.PI; g.add(c);
    const h = new THREE.Mesh(new THREE.SphereGeometry(.4, 48, 32), black()); h.position.set(0, .5, .85); g.add(h); return g; },
  gear() { const g = new THREE.Group(); const disc = new THREE.Mesh(new THREE.CylinderGeometry(1.25, 1.25, .55, 64), chrome()); disc.rotation.x = Math.PI / 2; g.add(disc);
    for (let i = 0; i < 8; i++) { const t = rbox(.55, .6, .55, .1, chrome()); const a = i / 8 * Math.PI * 2; t.position.set(Math.cos(a) * 1.4, Math.sin(a) * 1.4, -.27); t.rotation.z = a - Math.PI / 2; g.add(t); }
    const hole = new THREE.Mesh(new THREE.CylinderGeometry(.48, .48, .62, 48), black()); hole.rotation.x = Math.PI / 2; g.add(hole); return g; },
  coin() { const g = new THREE.Group(); const c = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, .4, 72), chrome()); c.rotation.x = Math.PI / 2; g.add(c);
    const rim = new THREE.Mesh(new THREE.TorusGeometry(1.5, .1, 16, 72), chrome()); g.add(rim);
    const face = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.15, .44, 72), black()); face.rotation.x = Math.PI / 2; g.add(face);
    const s1 = new THREE.Mesh(new THREE.TorusGeometry(.32, .1, 16, 48, Math.PI * 1.3), chrome()); s1.position.set(0, .28, .25); s1.rotation.z = .4; g.add(s1);
    const s2 = new THREE.Mesh(new THREE.TorusGeometry(.32, .1, 16, 48, Math.PI * 1.3), chrome()); s2.position.set(0, -.28, .25); s2.rotation.z = .4 + Math.PI; g.add(s2);
    const bar = rbox(.12, 1.5, .12, .05, chrome()); bar.position.set(0, 0, .27); g.add(bar); g.rotation.y = -.35; return g; },
  sparkle() { const g = new THREE.Group(); const sh = new THREE.Shape(); const R = 1.6, r = .38;
    for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2 + Math.PI / 2, rr = i % 2 ? r : R; const x = Math.cos(a) * rr, y = Math.sin(a) * rr; i ? sh.lineTo(x, y) : sh.moveTo(x, y); } sh.closePath();
    const geo = new THREE.ExtrudeGeometry(sh, { depth: .35, bevelEnabled: true, bevelThickness: .14, bevelSize: .1, bevelSegments: 6 }); geo.center(); g.add(new THREE.Mesh(geo, chrome()));
    const sm = new THREE.Mesh(geo.clone().scale(.38, .38, .38), black()); sm.position.set(1.25, 1.1, .2); g.add(sm); return g; },
  shield() { const g = new THREE.Group(); const sh = new THREE.Shape(); sh.moveTo(0, 1.7); sh.quadraticCurveTo(1.0, 1.35, 1.45, 1.35); sh.lineTo(1.45, .1); sh.quadraticCurveTo(1.35, -1.2, 0, -1.8); sh.quadraticCurveTo(-1.35, -1.2, -1.45, .1); sh.lineTo(-1.45, 1.35); sh.quadraticCurveTo(-1.0, 1.35, 0, 1.7);
    const geo = new THREE.ExtrudeGeometry(sh, { depth: .45, bevelEnabled: true, bevelThickness: .16, bevelSize: .12, bevelSegments: 8, curveSegments: 24 }); geo.center(); g.add(new THREE.Mesh(geo, black()));
    const a = rbox(.32, .8, .25, .12, chrome()); a.position.set(-.32, -.12, .42); a.rotation.z = .8; g.add(a); const b = rbox(.32, 1.45, .25, .12, chrome()); b.position.set(.28, .12, .42); b.rotation.z = -.62; g.add(b); return g; },
  chain() { const g = new THREE.Group(); const l1 = new THREE.Mesh(new THREE.TorusGeometry(.95, .26, 24, 72), chrome()); l1.scale.set(1.25, .75, 1); l1.position.x = -.75; l1.rotation.z = .5; g.add(l1);
    const l2 = new THREE.Mesh(new THREE.TorusGeometry(.95, .26, 24, 72), black()); l2.scale.set(1.25, .75, 1); l2.position.x = .75; l2.rotation.set(Math.PI / 2.4, 0, .5); g.add(l2); return g; },
  userplus() { const g = new THREE.Group(); const head = new THREE.Mesh(new THREE.SphereGeometry(.62, 64, 48), chrome()); head.position.set(-.45, .78, 0); g.add(head);
    // shoulders: a whole rounded body (no flat cut), squashed and set below the head
    const body = new THREE.Mesh(new THREE.LatheGeometry([[0, -.55], [.95, -.55], [1.12, -.45], [1.2, -.22], [1.12, .12], [.88, .42], [.5, .6], [0, .66]].map(([x, y]) => new THREE.Vector2(x, y)), 96), black()); body.scale.z = .62; body.position.set(-.45, -.62, 0); g.add(body);
    const p1 = rbox(1.1, .32, .32, .12, chrome()); p1.position.set(1.2, .05, .3); g.add(p1); const p2 = rbox(.32, 1.1, .32, .12, chrome()); p2.position.set(1.2, .05, .3); g.add(p2); return g; },
  ceo() { const g = new THREE.Group(); const r = .34, mat = chrome();
    const tube = pts => { const c = new THREE.CatmullRomCurve3(pts.map(([x, y]) => new THREE.Vector3(x, y, 0)), false, 'catmullrom', .2);
      g.add(new THREE.Mesh(new THREE.TubeGeometry(c, 96, r, 32, false), mat));
      for (const q of [pts[0], pts[pts.length - 1]]) { const sp = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 24), mat); sp.position.set(q[0], q[1], 0); g.add(sp); } };
    const arc = (cx, cy, rx, ry, a0, a1, n = 24) => Array.from({ length: n + 1 }, (_, i) => { const a = a0 + (a1 - a0) * i / n; return [cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]; });
    tube(arc(-2.35, 0, .78, .95, .75, Math.PI * 2 - .75));                                   // C
    { const sp = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 48), mat); sp.scale.set(r * 1.12, 1.2, r * 1.12); sp.position.set(-.6, 0, 0); g.add(sp); } tube([[-.6, .95], [-.02, .95]]); tube([[-.6, -.95], [-.02, -.95]]);   // E
    tube([[-.6, 0], [-.12, 0]]);                                                               // E middle
    tube(arc(1.55, 0, .82, .95, 0, Math.PI * 2, 48));                                          // O
    g.scale.setScalar(1); g.position.x = .42; return g; },

  // ---- more symbols for section labels ----
  bolt() { const g = new THREE.Group(); const sh = new THREE.Shape(); sh.moveTo(.35, 1.9); sh.lineTo(-1.05, -.2); sh.lineTo(-.05, -.2); sh.lineTo(-.45, -1.9); sh.lineTo(1.05, .35); sh.lineTo(.05, .35); sh.closePath();
    const geo = new THREE.ExtrudeGeometry(sh, { depth: .45, bevelEnabled: true, bevelThickness: .15, bevelSize: .1, bevelSegments: 6 }); geo.center(); g.add(new THREE.Mesh(geo, chrome())); return g; },
  star() { const g = new THREE.Group(); const sh = new THREE.Shape(); for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2 + Math.PI / 2, rr = i % 2 ? .78 : 1.75; const x = Math.cos(a) * rr, y = Math.sin(a) * rr; i ? sh.lineTo(x, y) : sh.moveTo(x, y); } sh.closePath();
    const geo = new THREE.ExtrudeGeometry(sh, { depth: .4, bevelEnabled: true, bevelThickness: .18, bevelSize: .12, bevelSegments: 6 }); geo.center(); g.add(new THREE.Mesh(geo, chrome())); return g; },
  globe() { const g = new THREE.Group(); g.add(new THREE.Mesh(new THREE.SphereGeometry(1.45, 64, 48), black()));
    for (const r of [0, Math.PI / 3, -Math.PI / 3]) { const m = new THREE.Mesh(new THREE.TorusGeometry(1.5, .07, 16, 96), chrome()); m.rotation.y = r; g.add(m); }
    for (const y of [-.75, 0, .75]) { const rr = Math.sqrt(1.5 * 1.5 - y * y); const m = new THREE.Mesh(new THREE.TorusGeometry(rr, .07, 16, 96), chrome()); m.rotation.x = Math.PI / 2; m.position.y = y; g.add(m); } return g; },
  chat() { const g = new THREE.Group(); g.add(rbox(3.4, 2.3, .45, .55, black())); const tail = new THREE.Mesh(new THREE.ConeGeometry(.42, .9, 4), black()); tail.position.set(-.95, -1.35, 0); tail.rotation.z = Math.PI + .5; g.add(tail);
    for (const x of [-.85, 0, .85]) { const d = new THREE.Mesh(new THREE.SphereGeometry(.27, 32, 24), chrome()); d.position.set(x, 0, .4); g.add(d); } return g; },
  layers() { const g = new THREE.Group(); for (let i = 0; i < 3; i++) { const l = rbox(2.6, 2.6, .25, .35, i === 1 ? black() : chrome()); l.rotation.x = -1.05; l.rotation.z = .785; l.position.y = (1 - i) * .75; g.add(l); } return g; },
  clock() { const g = new THREE.Group(); const f = new THREE.Mesh(new THREE.CylinderGeometry(1.55, 1.55, .4, 72), black()); f.rotation.x = Math.PI / 2; g.add(f);
    const rim = new THREE.Mesh(new THREE.TorusGeometry(1.55, .17, 24, 96), chrome()); g.add(rim);
    const h1 = rbox(.2, .95, .15, .08, chrome()); h1.position.set(0, .42, .3); g.add(h1); const h2 = rbox(.2, 1.15, .15, .08, chrome()); h2.position.set(.42, -.18, .3); h2.rotation.z = -2.1; g.add(h2);
    const hub = new THREE.Mesh(new THREE.SphereGeometry(.18, 24, 16), chrome()); hub.position.z = .3; g.add(hub); return g; },
  target() { const g = new THREE.Group();
    // a glossy black disc with a rounded chrome rim, a chrome ring and a domed chrome bullseye (all rounded, so they all catch the light)
    const face = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, .34, 96), black()); face.rotation.x = Math.PI / 2; g.add(face);
    const rim = new THREE.Mesh(new THREE.TorusGeometry(1.5, .2, 32, 128), chrome()); g.add(rim);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(.9, .16, 32, 128), chrome()); ring.position.z = .17; g.add(ring);
    const dome = new THREE.Mesh(new THREE.SphereGeometry(.42, 64, 48), chrome()); dome.scale.z = .7; dome.position.z = .17; g.add(dome); return g; },
  bars() { const g = new THREE.Group(); [[.9, -1.05], [1.6, 0], [2.6, 1.05]].forEach(([h, x], i) => { const b = rbox(.72, h, .7, .14, i === 2 ? chrome() : (i ? chrome() : black())); b.position.set(x, -1.2 + h / 2, 0); g.add(b); });
    const base = rbox(3.6, .18, .7, .06, black()); base.position.y = -1.35; g.add(base); return g; },
  lock() { const g = new THREE.Group(); g.add(rbox(2.6, 2.1, .7, .3, black())); const sh = new THREE.Mesh(new THREE.TorusGeometry(.82, .22, 24, 64, Math.PI), chrome()); sh.position.y = 1.05; g.add(sh);
    for (const x of [-.82, .82]) { const l = new THREE.Mesh(new THREE.CylinderGeometry(.22, .22, .5, 24), chrome()); l.position.set(x, .85, 0); g.add(l); }
    const kh = new THREE.Mesh(new THREE.CylinderGeometry(.24, .24, .2, 32), chrome()); kh.rotation.x = Math.PI / 2; kh.position.set(0, .05, .42); g.add(kh); const ks = rbox(.18, .5, .2, .06, chrome()); ks.position.set(0, -.3, .42); g.add(ks); g.position.y = -.35; return g; },
  rocket() { const g = new THREE.Group(); const body = new THREE.Mesh(new THREE.CylinderGeometry(.62, .62, 2.2, 48), chrome()); g.add(body);
    const nose = new THREE.Mesh(new THREE.ConeGeometry(.62, 1.1, 48), black()); nose.position.y = 1.65; g.add(nose);
    const win = new THREE.Mesh(new THREE.SphereGeometry(.26, 32, 24), black()); win.position.set(0, .35, .55); g.add(win);
    for (const a of [0, 2.09, 4.19]) { const f = rbox(.15, .9, .7, .05, black()); f.position.set(Math.sin(a) * .62, -.85, Math.cos(a) * .62); f.rotation.y = a; g.add(f); }
    const fl = new THREE.Mesh(new THREE.ConeGeometry(.38, .7, 32), chrome()); fl.position.y = -1.45; fl.rotation.z = Math.PI; g.add(fl); g.rotation.z = -.75; return g; },
  cursor() { const g = new THREE.Group(); const sh = new THREE.Shape(); sh.moveTo(-1.1, 1.7); sh.lineTo(-1.1, -1.25); sh.lineTo(-.35, -.55); sh.lineTo(.2, -1.75); sh.lineTo(.75, -1.5); sh.lineTo(.2, -.35); sh.lineTo(1.2, -.35); sh.closePath();
    const geo = new THREE.ExtrudeGeometry(sh, { depth: .4, bevelEnabled: true, bevelThickness: .14, bevelSize: .09, bevelSegments: 6 }); geo.center(); g.add(new THREE.Mesh(geo, chrome())); return g; },
  doc() { const g = new THREE.Group(); g.add(rbox(2.5, 3.2, .3, .25, black())); for (const [y, w] of [[.9, 1.6], [.35, 1.6], [-.2, 1.6], [-.75, 1.0]]) { const l = rbox(w, .2, .12, .08, chrome()); l.position.set((w - 1.6) / 2, y, .22); g.add(l); } return g; },
  question() { const g = new THREE.Group(); const arc = new THREE.Mesh(new THREE.TorusGeometry(.85, .3, 32, 72, Math.PI * 1.35), chrome()); arc.position.y = .75; arc.rotation.z = -.55; g.add(arc);
    const stem = rbox(.6, .85, .6, .25, chrome()); stem.position.set(0, -.45, 0); g.add(stem); const dot = new THREE.Mesh(new THREE.SphereGeometry(.36, 32, 24), chrome()); dot.position.y = -1.45; g.add(dot); return g; },
  // the floating shape: a twisted chrome ring
  blob() { const m = new THREE.Mesh(new THREE.TorusKnotGeometry(1.25, .48, 360, 64, 2, 3), new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 1, roughness: .05, clearcoat: 1, clearcoatRoughness: .03, envMapIntensity: 1.5 })); return m; },
};
window.show = (name, ry, rx, scale) => {
  while (G.children.length) G.remove(G.children[0]);
  const o = ICONS[name](); G.add(o); G.rotation.set(rx ?? -.25, ry ?? .5, 0); G.scale.setScalar(scale || 1);
  const ortho = new THREE.OrthographicCamera(-3.4, 3.4, 3.4, -3.4, .1, 100); ortho.position.set(0, 0, 9); ortho.lookAt(0, 0, 0);
  renderer.render(scene, name === 'ceo' ? ortho : cam); return document.getElementById('c').toDataURL('image/png');
};
window.ready = true;
</script></body></html>
